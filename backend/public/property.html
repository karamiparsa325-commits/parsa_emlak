<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Parsa Emlak — İlan detayı" />
  <title>İlan Detayı — Parsa Emlak</title>
  <link rel="stylesheet" href="style.css?v=4" />

  <header class="main-header" id="main-header">
    <div style="display:flex;align-items:center">

      <a href="/" class="btn btn-outline" style="padding:8px 16px;text-decoration:none">← Tüm İlanlar</a>

  <main class="property-page" style="max-width:1100px;margin:120px auto 40px;padding:0 24px">

      Yükleniyor...

  <footer class="site-footer">

      <div class="footer-section"><h3>Ofisimiz</h3><p>Cumhuriyet Bulvarı, No: 123<br/>Alsancak / İZMİR</p></div>
      <div class="footer-section"><h3>İletişim</h3><p>Tel: +90 232 123 45 67<br/>info@parsaemlak.com</p></div>
    </div>
    <div class="footer-bottom">&copy; 2026 Parsa Emlak.</div>
  </footer>

  <script src="property.js?v=2"></script>
